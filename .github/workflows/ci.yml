name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    # No `container:` here on purpose. Pinning a java:21 image while running a
    # 21/25 matrix made the matrix a no-op: every leg built on the image's JDK.
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # Reject a tampered or hand-edited wrapper before it can run.
          validate-wrappers: true

      - name: Check formatting and lint
        run: ./gradlew ktlintCheck

      - name: Build, test and verify coverage
        run: ./gradlew build

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-jdk${{ matrix.java }}
          path: |
            antlr4/build/reports/tests/
            antlr4/build/reports/jacoco/
          retention-days: 7

  antlr-ng:
    name: antlr-ng target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: antlr-ng
        run: npm install

      # Generate from the shared grammars so a change to grammars/ that breaks the
      # TypeScript target fails here rather than at release time.
      - name: Generate parser from shared grammars
        working-directory: antlr-ng
        run: npm run generate

      - name: Type-check
        working-directory: antlr-ng
        run: npm run build
