name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    # No `container:` here on purpose. Pinning a java:21 image while running a
    # 21/25 matrix made the matrix a no-op: every leg built on the image's JDK.
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          # Reject a tampered or hand-edited wrapper before it can run.
          validate-wrappers: true

      - name: Check formatting and lint
        run: ./gradlew ktlintCheck

      # The corpus gate skips without a checkout, so without this step CI would
      # not enforce the parse-rate floor it claims.
      - name: Check out the pinned Flix corpus
        uses: actions/checkout@v7
        with:
          repository: flix/flix
          ref: debf7df0fdd63f2b76b7a539ebbff5243070ca6e
          path: corpus

      - name: Verify the corpus is the pinned revision
        run: |
          test -d corpus/main || { echo "corpus/main missing"; exit 1; }
          COUNT=$(find corpus/main -name '*.flix' | wc -l | tr -d ' ')
          echo "corpus files: $COUNT"
          test "$COUNT" -ge 690 || { echo "unexpected corpus size $COUNT"; exit 1; }

      - name: Build, test and verify coverage
        run: ./gradlew build -Dflix.corpus="$GITHUB_WORKSPACE/corpus/main"

      - name: Verify generated documentation is current
        run: |
          node tools/gen-docs.mjs
          git diff --exit-code -- docs/SYNTAX.md docs/RAILROAD.md \
            || { echo "docs/ is stale; run: node tools/gen-docs.mjs"; exit 1; }

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-jdk${{ matrix.java }}
          path: |
            antlr4/build/reports/tests/
            antlr4/build/reports/jacoco/
          retention-days: 7

  antlr-ng:
    name: antlr-ng target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: antlr-ng
        run: npm ci

      # Only the hand-written runtime support is checked. Generating the parser
      # from the shared grammars does not yet produce compilable TypeScript;
      # see docs/DEFECTS.md D11.
      - name: Type-check
        working-directory: antlr-ng
        run: npm run build

      - name: Test
        working-directory: antlr-ng
        run: npm test
