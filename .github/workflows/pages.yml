name: Publish npm package to Pages

# Serves the npm package (grammars + FlixLexerBase.ts) as immutable tarballs from the gh-pages
# branch, with index.json listing every version and latest.json naming the newest:
#   https://wstein.github.io/flix-antlr-grammar/wstein-flix-antlr-grammar-<version>.tgz
# One-time setup: Settings > Pages > Source = "Deploy from a branch", branch gh-pages, folder /.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (must equal v<package.json version>)
        required: true

permissions:
  contents: write

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Pack and publish to gh-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Tag must match package.json
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "v$version" ]; then
            echo "tag $tag does not match package.json version $version" >&2
            exit 1
          fi

      - name: Check out gh-pages (or start it)
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git clone --branch gh-pages --single-branch "https://github.com/${GITHUB_REPOSITORY}.git" ../pages
          else
            mkdir ../pages && git -C ../pages init -b gh-pages
          fi
          touch ../pages/.nojekyll

      - name: Add the tarball and refresh the index
        run: node tools/publish-pages.mjs ../pages

      - name: Push gh-pages
        working-directory: ../pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "nothing to publish"; exit 0; }
          git commit -m "Publish ${{ inputs.tag || github.ref_name }}"
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin gh-pages
